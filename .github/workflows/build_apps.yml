name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Vektolux.ipa Payload
          ls -lh Vektolux.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Vektolux.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-dir

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ipa-dir

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          cp apk-dir/app-release.apk release-assets/
          cp ipa-dir/Vektolux.ipa release-assets/
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vektolux Latest Mobile Release (v1.0.9)"
          body: |
            ## Vektolux Mobile App Builds (v1.0.9) — Multi-Tier Escrow & Settlements Release

            ### Direct Downloads:
            - 📱 **iOS IPA (No Codesign)**: [`Vektolux.ipa`](https://github.com/luckykargbo/Vektolux/releases/download/latest/Vektolux.ipa)
              * Install on iOS devices via AltStore, Sideloadly, TrollStore, Scarlet, or Enterprise signing.
            - 🤖 **Android APK**: [`app-release.apk`](https://github.com/luckykargbo/Vektolux/releases/download/latest/app-release.apk)
              * Direct sideload / install on any Android device.

            ### What's New in this Build (v1.0.9):
            - **Multi-Tier Real Estate Escrow System (Sierra Leone SLE)**:
              * **Anti-Bypass Inspection Pass**: Micro-escrow booking fee (SLE 50-100), mutual 4-digit verification OTP & QR hash, 85% instant payout to field agents, unmasks landlord contact upon arrival.
              * **Short-Term Guest Stays**: 24-hour host release hold after check-in, segregated refundable caution/kitchen deposit vault.
              * **Long-Term Tenancy Leases**: 10% statutory agency commission split (85% net to agent, 15% platform fee) with locked caution deposit vault.
              * **Land & House Outright Purchases**: 10/40/50 gated milestones (OARG title clearance → Ministry survey verification → Conveyance deed registration).
            - **Production Vehicle Escrow & Settlement Engine**:
              * 60/40 rental split handoff release with 6-photo pre-trip and post-trip digital vehicle inspections.
              * Sierra Leone Road Safety Authority (SLRSA) Form C and Blue Book title transfer verification for outright vehicle purchases.
            - **Mobile Escrow Console & Agent Portal**:
              * Dedicated screens: `InspectionPassModal`, `InspectionPassVerificationScreen`, `RealEstateEscrowCheckoutScreen`, `RealEstateEscrowTrackingScreen`, and `MyRealEstateEscrowsScreen`.
              * Full Orange Money SL and Africell Afrimoney SL mobile payment rail support.
          files: |
            release-assets/Vektolux.ipa
            release-assets/app-release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Vektolux.ipa Payload
          ls -lh Vektolux.ipa

      - name: Validate IPA (bundle id, version, architecture, archive integrity)
        run: |
          PL=build/ios/iphoneos/Runner.app/Info.plist
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PL")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PL")
          BLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PL")
          echo "Bundle ID: $BID  Version: $VER  Build: $BLD"
          test "$BID" = "com.vektolux.app"
          test "$VER" = "1.0.27"
          test "$BLD" = "28"
          lipo -info build/ios/iphoneos/Runner.app/Runner
          lipo -info build/ios/iphoneos/Runner.app/Runner | grep -q arm64
          unzip -tq Vektolux.ipa
          SIZE=$(stat -f%z Vektolux.ipa); echo "IPA size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          # no secrets/config files packaged
          if unzip -l Vektolux.ipa | grep -Ei "\.env|key\.properties|\.p12|\.jks|\.mobileprovision|GoogleService-Info"; then echo "Unexpected sensitive file in IPA"; exit 1; fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Vektolux.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (APK & IPA)
    # The iPhone test build is published as soon as the IPA is ready; it no longer waits for
    # (or is blocked by) the Android build, which can hang.
    needs: [build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository (release notes)
        uses: actions/checkout@v4

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ipa-dir

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          if [ -d apk-dir ] && [ -f apk-dir/app-release.apk ]; then cp apk-dir/app-release.apk release-assets/; fi
          if [ -d ipa-dir ] && [ -f ipa-dir/Vektolux.ipa ]; then cp ipa-dir/Vektolux.ipa release-assets/; fi
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Test build for physical-iPhone testing (unsigned IPA, signed by Sideloadly on install).
          tag_name: vektolux-ios-test-1.0.27-28
          name: "Vektolux iPhone Test Build 1.0.27 (28)"
          body_path: docs/IOS_TEST_BUILD.md
          files: release-assets/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # android/gradle.properties is tuned for a low-memory PC (1 GB Gradle heap). On CI that heap
      # makes the release build thrash and stall; ~/.gradle/gradle.properties takes precedence.
      - name: Give Gradle enough memory on CI
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmOptions=-Xmx2g" >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Vektolux.ipa Payload
          ls -lh Vektolux.ipa

      - name: Validate IPA (bundle id, version, architecture, archive integrity)
        run: |
          PL=build/ios/iphoneos/Runner.app/Info.plist
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PL")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PL")
          BLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PL")
          echo "Bundle ID: $BID  Version: $VER  Build: $BLD"
          test "$BID" = "com.vektolux.app"
          test "$VER" = "1.0.31"
          test "$BLD" = "32"
          lipo -info build/ios/iphoneos/Runner.app/Runner
          lipo -info build/ios/iphoneos/Runner.app/Runner | grep -q arm64
          unzip -tq Vektolux.ipa
          SIZE=$(stat -f%z Vektolux.ipa); echo "IPA size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          # no secrets/config files packaged
          if unzip -l Vektolux.ipa | grep -Ei "\.env|key\.properties|\.p12|\.jks|\.mobileprovision|GoogleService-Info"; then echo "Unexpected sensitive file in IPA"; exit 1; fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Vektolux.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (IPA)
    # The iPhone test build is published as soon as the IPA is ready; it no longer waits for
    # (or is blocked by) the Android build, which can hang.
    needs: [build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository (release notes)
        uses: actions/checkout@v4

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ipa-dir

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          cp ipa-dir/Vektolux.ipa release-assets/
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Test build for physical-iPhone testing (unsigned IPA, signed by Sideloadly on install).
          tag_name: vektolux-ios-test-1.0.31-32
          name: "Vektolux Test Build 1.0.31 (32): iPhone & Android"
          body_path: docs/IOS_TEST_BUILD.md
          files: release-assets/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Attach Android APK to the Release
    # Runs after the iPhone release (never racing it to create the release) and never delays the IPA.
    needs: [build-android, release]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository (release notes)
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-dir

      - name: Validate and name the APK
        run: |
          mkdir -p release-assets
          cp apk-dir/app-release.apk release-assets/Vektolux.apk
          unzip -tq release-assets/Vektolux.apk
          SIZE=$(stat -c%s release-assets/Vektolux.apk); echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          ls -lh release-assets/

      - name: Add the APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vektolux-ios-test-1.0.31-32
          name: "Vektolux Test Build 1.0.31 (32): iPhone & Android"
          body_path: docs/IOS_TEST_BUILD.md
          files: release-assets/Vektolux.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


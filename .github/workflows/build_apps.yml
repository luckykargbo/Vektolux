name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Vektolux.ipa Payload
          ls -lh Vektolux.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Vektolux.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-dir

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ipa-dir

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          cp apk-dir/app-release.apk release-assets/
          cp ipa-dir/Vektolux.ipa release-assets/
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vektolux Latest Mobile Release (v1.0.2)"
          body: |
            ## Vektolux Mobile App Builds (v1.0.2)

            ### Direct Downloads:
            - 📱 **iOS IPA (No Codesign)**: [`Vektolux.ipa`](https://github.com/luckykargbo/Vektolux/releases/download/latest/Vektolux.ipa)
              * Install on iOS devices via AltStore, Sideloadly, TrollStore, Scarlet, or Enterprise signing.
            - 🤖 **Android APK**: [`app-release.apk`](https://github.com/luckykargbo/Vektolux/releases/download/latest/app-release.apk)
              * Direct sideload / install on any Android device.

            ### What's New in this Build (v1.0.2):
            - **Dynamic Vehicle Tier Catalog**: 4 Sierra Leone transport tiers (Keke/Bajaj, Okada/Bike, Standard Taxi, Cargo/Van) with transparent upfront SLE rates.
            - **3D Isometric Vehicle Render Engine**: Offline-safe vector isometric illustrations with glass glare, alloy rims, and dynamic drop shadows.
            - **Driver Vehicle Onboarding Multi-Step Wizard**: Complete onboarding flow with category selection, structured vehicle specs, dynamic brand suggestions, and private verification document uploads.
            - **Driver Verification Online Gating**: Strict security enforcement preventing unverified drivers from accepting rides until approved by an administrator.
            - **Clean Rider-Facing Identity**: 100% elimination of raw camera car photos; replaced by clean 3D isometric twin renders, verified driver avatars, and formatted vehicle badges.
            - **Universal Avatar System & Post-Registration Uploads**: Dynamic initials fallback (`MK`), no avatar friction during signup, and direct profile photo upload in Settings.
            - **Resilient Network & Socket Recovery**: Hardened connection pool handling on iOS Darwin sockets to eliminate errno 54 resets.
          files: |
            release-assets/Vektolux.ipa
            release-assets/app-release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


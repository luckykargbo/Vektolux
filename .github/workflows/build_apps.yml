name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Vektolux.ipa Payload
          ls -lh Vektolux.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Vektolux.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-dir

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ipa-dir

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          cp apk-dir/app-release.apk release-assets/
          cp ipa-dir/Vektolux.ipa release-assets/
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vektolux Latest Mobile Release (v1.0.4)"
          body: |
            ## Vektolux Mobile App Builds (v1.0.4) — Multi-Vertical Super App

            ### Direct Downloads:
            - 📱 **iOS IPA (No Codesign)**: [`Vektolux.ipa`](https://github.com/luckykargbo/Vektolux/releases/download/latest/Vektolux.ipa)
              * Install on iOS devices via AltStore, Sideloadly, TrollStore, Scarlet, or Enterprise signing.
            - 🤖 **Android APK**: [`app-release.apk`](https://github.com/luckykargbo/Vektolux/releases/download/latest/app-release.apk)
              * Direct sideload / install on any Android device.

            ### What's New in this Build (v1.0.4):
            - **Multi-Vertical Super App Architecture**:
              * **5-Tab Persistent Navigation Shell**: 🏠 Home (Discovery Feed), 🚗 Rides (Live Radar & Hailing), 🏢 Real Estate (Marketplace), 🚘 Auto Market (Showroom & Rentals), 👤 Account (Profile & Operator Mode).
              * **Curated Discovery Home Feed**: Header with dynamic greetings, user avatar, location chip (📍 Freetown Central, Aberdeen, Lumley, Waterloo, Bo, Kenema, Makeni), search bar, 4 service quick-launch cards, snap-scroll carousels for verified real estate & auto showroom, and quick ride hailing shortcuts.
              * **Dedicated Vertical Marketplaces**:
                - *Real Estate Marketplace*: Filter by Category (All, Houses, Apartments, Hourly Guest Houses, Land, Commercial), Intent (Rent, Buy, Hourly Stay), and City.
                - *Auto Market & Rentals*: Filter by Listing Intent (Buy/Sale vs Daily Rental) and Vehicle Type (Keke, Sedan, SUV, Van/Pickup), complete with specs and instant contact.
              * **Dynamic Role Switching & Operator Workspaces**:
                - Seamless toggle between "Client Mode" and "Operator Mode" directly from the Account tab.
                - Dynamic vendor upgrade cards to apply as Driver/Keke Operator, Real Estate Agent, or Auto Dealer.
                - Integrated Operator Dashboard granting certified operators instant access to their dispatch radar, property listings, and auto showroom.
            - **Convex Multi-Role Schema & Authentic Sierra Leone Data Seed**:
              * Extended user schema with `activeRole`, `isVerifiedDriver`, `isVerifiedAgent`, `isVerifiedMerchant`, and `role_applications`.
              * Seeded rich discovery data with verified listings across Freetown, Waterloo, and Bo.
            - **Resilient Offline Caching & Zero Static Errors**:
              * Optimized SQLite DAOs and seamless fallbacks between Convex Cloud and local Drift cache.
          files: |
            release-assets/Vektolux.ipa
            release-assets/app-release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


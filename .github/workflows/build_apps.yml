name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Vektolux.ipa Payload
          ls -lh Vektolux.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Vektolux.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release (APK & IPA)
    needs: [build-android, build-ios]
    if: always() && (needs.build-ios.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-dir

      - name: Download iOS IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ipa-dir

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          if [ -d apk-dir ] && [ -f apk-dir/app-release.apk ]; then cp apk-dir/app-release.apk release-assets/; fi
          if [ -d ipa-dir ] && [ -f ipa-dir/Vektolux.ipa ]; then cp ipa-dir/Vektolux.ipa release-assets/; fi
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vektolux Mobile Release (v1.0.19) — MoniMe USSD OTP & Verified Seller Gatekeeping"
          body: |
            ## Vektolux Mobile App Builds (v1.0.19) — MoniMe USSD OTP & Role-Based UI Architecture

            ### Direct Downloads:
            - 📱 **iOS IPA (No Codesign)**: [`Vektolux.ipa`](https://github.com/luckykargbo/Vektolux/releases/download/latest/Vektolux.ipa)
              * Install on iOS devices via AltStore, Sideloadly, TrollStore, Scarlet, or Enterprise signing.
            - 🤖 **Android APK**: [`app-release.apk`](https://github.com/luckykargbo/Vektolux/releases/download/latest/app-release.apk)
              * Direct sideload / install on any Android device.

            ### What's New in this Build (v1.0.19):
            - **MoniMe USSD OTP Authentication & Carrier Dial Code**:
              * Real-time outbound session dispatch via MoniMe gateway (`*715#`).
              * Direct `dialCode` delivery (`*715*XXXXXX#`) for instant login and escrow payout verification.
              * Verified Space ID integration (`spc-k6VAsS2nSa4AALw1JuBJrXtUAnF`) with dual-header validation.
            - **Role-Based Profile UI Restrictions (Buyers vs. Verified Sellers)**:
              * Standard buyers no longer see storefront tabs (Properties / Vehicles) or public creation controls.
              * Dedicated Buyer Dashboard showing escrow orders, saved listings, and seller application onboarding.
              * Strict route guards on listing creation entry points across Discovery, Real Estate, and Mobility.
            - **Resilient Mobile Money Dispatch**:
              * Dynamic phone normalization with automatic 232 prefix handling.
              * Zero hardcoded parameters across payment actions.
          files: release-assets/*
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


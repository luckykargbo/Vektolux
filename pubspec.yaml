name: vektolux
description: Vektolux Multi-Vertical Marketplace — Real Estate & Mobility
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # ── Local Database (Drift / SQLite) ───────────────────────────────
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Networking & Connectivity ─────────────────────────────────────
  connectivity_plus: ^6.0.5
  dio: ^5.7.0

  # ── Convex Client ─────────────────────────────────────────────────
  # Using HTTP fallback; replace with convex_flutter FFI when available
  http: ^1.2.2

  # ── Typography ────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Dependency Injection ──────────────────────────────────────────
  get_it: ^8.0.0

  # ── Routing ───────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── Serialization ─────────────────────────────────────────────────
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # ── Utilities ─────────────────────────────────────────────────────
  intl: ^0.19.0
  logger: ^2.4.0
  rxdart: ^0.28.0
  stream_transform: ^2.1.0

  # ── SVG Vector Rendering ─────────────────────────────────────
  flutter_svg: ^2.0.10

  # ── Map & Geolocation SDK ─────────────────────────────────────────
  flutter_map: ^8.0.0
  latlong2: ^0.10.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code Generation ──────────────────────────────────────────────
  build_runner: ^2.4.12
  drift_dev: ^2.20.1
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/sqlite3.wasm
